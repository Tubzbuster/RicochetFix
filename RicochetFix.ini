; ============================================================================
;  RicochetFix settings
;  Works with Ricochet Infinity, Ricochet Lost Worlds and
;  Ricochet Lost Worlds: Recharged. Keep this file next to winmm.dll.
; ============================================================================

[Display]
; borderless = fills your monitor, no resolution switching, instant alt-tab
; windowed   = a normal window you can move and resize
; off        = RicochetFix does nothing (the game behaves as before)
Mode=borderless

; How the 800x600 picture is scaled up:
; smooth  = soft, no jagged edges (recommended)
; sharp   = crisp nearest-neighbour pixels
; integer = crisp, whole-number scale only (2x, 3x...), bigger black borders
; stretch = fill the whole screen, ignoring the 4:3 shape (not recommended)
Scaling=smooth

; Windowed mode size as a multiple of 800x600 (1 = 800x600, 2 = 1600x1200).
; 0 = pick a size that fills about 85% of your screen.
WindowScale=0

; 1 = sync page flips to your display (smooth, no tearing). 0 = off.
VSync=1

; 1 = keep the mouse inside the game picture in borderless mode, so the
; paddle can't wander onto a second monitor. 0 = off.
ClipCursor=1

; 1 = Alt+Enter switches between borderless and windowed. 0 = off.
AltEnterToggle=1

[Debug]
; 1 = write RicochetFix.log next to the DLL (useful for bug reports).
Log=1

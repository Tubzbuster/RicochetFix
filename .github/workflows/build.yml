name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (32-bit)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip
      - name: Build
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: RicochetFix
          path: build/dist/

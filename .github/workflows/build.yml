name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (32-bit)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 zip
      - name: Build
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: RicochetFix
          path: build/dist/
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RicochetFix ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: build/RicochetFix-*.zip
